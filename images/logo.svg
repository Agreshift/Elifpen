<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" width="620" height="170" role="img" aria-label="Elif Pen - Pvc Kapı ve Pencere Sistemleri">
  <title>Elif Pen</title>
  <g id="mark">
    <!-- Kapı -->
    <rect x="10" y="16" width="46" height="138" fill="#c5124e"/>
    <circle cx="48" cy="88" r="4.5" fill="#ffffff"/>
    <!-- Yükselen ok -->
    <path d="M74 156 L74 40" stroke="#1b9dd9" stroke-width="11" fill="none"/>
    <path d="M74 12 L92 46 L56 46 Z" fill="#1b9dd9"/>
    <!-- Pencere -->
    <rect x="100" y="30" width="66" height="110" fill="#c5124e"/>
    <rect x="129" y="30" width="8" height="110" fill="#ffffff"/>
    <rect x="100" y="81" width="66" height="8" fill="#ffffff"/>
  </g>
  <g id="wordmark" font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif" font-weight="900">
    <text x="180" y="92" font-size="68" letter-spacing="4" fill="#1b9dd9">ELIF <tspan fill="#c5124e">PEN</tspan></text>
    <rect x="180" y="112" width="424" height="36" fill="#c5124e"/>
    <text x="392" y="137" font-size="19" letter-spacing="1.2" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-weight="700">Pvc Kapı ve Pencere Sistemleri</text>
  </g>
</svg>
